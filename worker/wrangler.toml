name = "findback-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ENV = "production"
# Comma-separated browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://dhanush7921.github.io,https://localhost,capacitor://localhost"
# Staff allowlist "email:role,email:role" (roles: admin, staff). Empty = staff access disabled.
STAFF_EMAILS = ""
STAFF_DOMAIN = ""

# Secrets (set with `wrangler secret put`, or by the deploy workflow from GitHub secrets):
#   GAS_URL, GAS_SHARED_SECRET, PIN_PEPPER, SESSION_KEY, GOOGLE_CLIENT_ID, TURNSTILE_SECRET

[[ratelimits]]
name = "RL_SUBMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ACCESS"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[env.dev]
name = "findback-api-dev"
[env.dev.vars]
APP_ENV = "development"
STAFF_DOMAIN = ""
DEV_STAFF_LOGIN = "1"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,http://127.0.0.1:4173"
STAFF_EMAILS = ""
PIN_PEPPER = "dev-only-pepper-not-secret-000000"
SESSION_KEY = "dev-only-session-key-not-secret-0"

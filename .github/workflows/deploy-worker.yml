name: Deploy API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write # to start the Pages rebuild once the API is healthy
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
        run: |
          # Validate the Cloudflare token first, so it can be checked before Apps Script is set up.
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # Diagnostics only: token status and account-ID shape (no secret values are printed).
            [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex ID (check for spaces or a pasted URL)."
            [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]] && echo "::error::CLOUDFLARE_API_TOKEN contains whitespace or a newline."
            for v in "user/tokens/verify" "accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
              echo "verify ${v%%/*}-scoped: $(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$v" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
            done
            r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
            if echo "$r" | jq -e '.success' >/dev/null; then echo "Cloudflare token can manage Workers on this account."
            else echo "::error::Cloudflare token cannot manage Workers on account CLOUDFLARE_ACCOUNT_ID: $(echo "$r" | jq -c '[.errors[]?.message]'). Create it from the 'Edit Cloudflare Workers' template."; exit 1; fi
            sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
            [ -n "$sub" ] && echo "workers.dev subdomain: $sub" || echo "::warning::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to choose one."
          fi
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GAS_URL GAS_SHARED_SECRET; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing. The API was NOT deployed. See docs/DEPLOYMENT.md."
            exit 1
          fi
          case "$GAS_URL" in https://script.google.com/*/exec) ;; *) echo "::error::GAS_URL must be the Apps Script web app https://script.google.com/.../exec URL"; exit 1;; esac
          echo "All required secrets are present (values not shown)."
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Deploy Worker and sync secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          STAFF_EMAILS: ${{ vars.STAFF_EMAILS }}
          STAFF_DOMAIN: ${{ vars.STAFF_DOMAIN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EXTRA_ORIGINS: ${{ vars.EXTRA_ORIGINS }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          set -euo pipefail
          origins="${PAGES_ORIGIN,,},https://localhost,capacitor://localhost${EXTRA_ORIGINS:+,$EXTRA_ORIGINS}"
          npx wrangler deploy --config worker/wrangler.toml \
            --var "ALLOWED_ORIGINS:${origins}" --var "STAFF_EMAILS:${STAFF_EMAILS:-}" \
            --var "STAFF_DOMAIN:${STAFF_DOMAIN:-}" --var "TURNSTILE_SITE_KEY:${TURNSTILE_SITE_KEY:-}" | tee deploy.log
          # Secrets go from GitHub's encrypted store straight to Cloudflare; they are never printed or committed.
          # PIN_PEPPER / SESSION_KEY: if not stored in GitHub, they are generated once inside Cloudflare and kept there
          # (an existing Cloudflare value is never replaced, because changing PIN_PEPPER would invalidate every PIN).
          existing=$(npx wrangler secret list --config worker/wrangler.toml 2>/dev/null || echo '[]')
          EXISTING="$existing" node -e '
            const crypto = require("crypto");
            let have = []; try { have = JSON.parse(process.env.EXISTING).map((x) => x.name); } catch {}
            const keys = ["GAS_URL","GAS_SHARED_SECRET","PIN_PEPPER","SESSION_KEY","GOOGLE_CLIENT_ID","TURNSTILE_SECRET"];
            const o = {}; for (const k of keys) if (process.env[k]) o[k] = process.env[k];
            for (const k of ["PIN_PEPPER","SESSION_KEY"]) if (!o[k] && !have.includes(k)) { o[k] = crypto.randomBytes(32).toString("base64url"); console.log("Generated " + k + " inside Cloudflare (value not shown)."); }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(o));'
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" --config worker/wrangler.toml
          rm -f "$RUNNER_TEMP/secrets.json"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          echo "Worker URL: $url"
      - name: Live health check
        run: |
          sleep 5
          curl -sS "$WORKER_URL/api/health" | tee health.json
          grep -q '"storeReachable":true' health.json || (echo "::error::API deployed but cannot reach Apps Script / secrets incomplete" && exit 1)
      - name: Rebuild the website against this API
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f api_base="$WORKER_URL"

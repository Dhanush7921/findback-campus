name: Deploy frontend (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables). Public values only.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: npm run build:pages
      - name: Custom domain (optional)
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test (HTTPS, SPA deep link)
        run: |
          set -e
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null "$url" && break || sleep 10; done
          curl -fsS "$url" | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' "${url}track"); echo "deep link /track -> $code (404 status with SPA fallback body is expected on Pages)"
          curl -fsS "${url}manifest.webmanifest" | grep -q '"standalone"'
